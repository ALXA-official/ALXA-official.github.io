<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALXA • Coming Soon</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');

    :root {
        --primary: #00f5ff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: #0a0a0a;
        color: white;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Animated Background */
    .bg {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 20% 30%, rgba(0, 245, 255, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.08) 0%, transparent 50%);
        z-index: 1;
    }

    canvas {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.6;
    }

    .container {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 40px 20px;
        max-width: 620px;
    }

    .logo {
        width: 220px;
        filter: drop-shadow(0 0 40px var(--primary));
        animation: logoPulse 4s ease-in-out infinite;
        margin-bottom: 20px;
    }

    @keyframes logoPulse {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.05) rotate(2deg); }
    }

    h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 4.2rem;
        font-weight: 600;
        background: linear-gradient(90deg, #ffffff, var(--primary), #ffffff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: titleGlow 3s ease-in-out infinite alternate;
        margin-bottom: 12px;
        letter-spacing: -2px;
    }

    @keyframes titleGlow {
        from { filter: brightness(1) hue-rotate(0deg); }
        to { filter: brightness(1.3) hue-rotate(15deg); }
    }

    .subtitle {
        color: #888;
        font-size: 1.35rem;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeUp 1s forwards 0.6s;
    }

    .box {
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(0, 245, 255, 0.2);
        border-radius: 20px;
        padding: 32px 40px;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 60px rgba(0, 245, 255, 0.15);
        position: relative;
        overflow: hidden;
    }

    .box::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 60%;
        height: 60%;
        background: radial-gradient(circle, rgba(0,245,255,0.15) 0%, transparent 70%);
        animation: scanline 6s linear infinite;
    }

    @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(400%); }
    }

    #msg {
        font-size: 1.35rem;
        color: #ddd;
        line-height: 1.6;
        opacity: 0;
        animation: fadeUp 1s forwards 0.9s;
    }

    .progress {
        margin: 30px 0;
        height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 9999px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), #8a2be2);
        animation: progressAnim 4s ease-in-out forwards infinite alternate;
    }

    @keyframes progressAnim {
        from { width: 42%; }
        to { width: 78%; }
    }

    /* Status dots */
    .status {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
    }

    .dot {
        width: 10px;
        height: 10px;
        background: var(--primary);
        border-radius: 50%;
        box-shadow: 0 0 15px var(--primary);
        animation: dotPulse 1.8s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dotPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    select {
        padding: 12px 24px;
        background: rgba(255,255,255,0.08);
        color: white;
        border: 1px solid rgba(0,245,255,0.3);
        border-radius: 9999px;
        font-size: 1rem;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.3s;
    }

    select:hover {
        background: rgba(0,245,255,0.1);
        border-color: var(--primary);
    }

    /* Particles container */
    .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
    }
</style>
</head>
<body>

    <div class="bg"></div>
    <canvas id="canvas"></canvas>

    <div class="container">
        <img src="ALXA_LOGO.png" alt="ALXA Logo" class="logo" id="logo">

        <h1 id="title">COMING SOON</h1>
        <p id="subtitle" class="subtitle">Something extraordinary is being built</p>

        <div class="box">
            <div class="status">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <p id="msg">We are crafting the future. Stay tuned.</p>
            
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            
            <p style="font-size:0.95rem; color:#666; margin-top:8px;">Estimated launch: Q3 2026</p>
        </div>

        <br><br>
        <!-- Language Switch -->
        <select onchange="setLang(this.value)">
            <option value="en">English</option>
            <option value="es">Español</option>
        </select>
    </div>

    <script>
        // Language support
        const lang = {
            en: {
                title: "COMING SOON",
                subtitle: "Something extraordinary is being built",
                msg: "We are crafting the future. Stay tuned."
            },
            es: {
                title: "PRÓXIMAMENTE",
                subtitle: "Algo extraordinario se está construyendo",
                msg: "Estamos creando el futuro. Mantente atento."
            }
        };

        function setLang(l) {
            document.getElementById("title").textContent = lang[l].title;
            document.getElementById("subtitle").textContent = lang[l].subtitle;
            document.getElementById("msg").textContent = lang[l].msg;
        }

        // Canvas Particle Background
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.6 + 0.3;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.fillStyle = `rgba(0, 245, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 180; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });
        
        // Initialize everything
        resizeCanvas();
        initParticles();
        animate();

        // Easter egg: click logo for extra glow
        document.getElementById('logo').addEventListener('click', () => {
            const logo = document.getElementById('logo');
            logo.style.filter = 'drop-shadow(0 0 80px #00f5ff) brightness(1.8)';
            setTimeout(() => {
                logo.style.filter = 'drop-shadow(0 0 40px #00f5ff)';
            }, 600);
        });
    </script>
</body>
</html>
